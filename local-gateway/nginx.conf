# Gateway local (docker compose, profile "app") — espelha o roteamento do API Gateway
# da AWS (workbench-gateway/terraform): cada prefixo vai para o microsserviço dono.
# Não valida JWT (na AWS isso é a Lambda authorizer); cada serviço valida o token
# de qualquer forma, então as rotas protegidas continuam exigindo Bearer.
# Também é o alvo único do scan DAST (OWASP ZAP) da plataforma.
server {
    listen 8000;
    server_tokens off;

    # DNS do Docker resolvido a cada 10 s (com proxy_pass por variável): se um serviço
    # for recriado e mudar de IP, o gateway acompanha sem precisar reiniciar.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $customer  http://customer-service:8080;
    set $billing   http://billing-service:8080;
    set $execution http://execution-service:8080;
    set $os        http://os-service:8080;
    client_max_body_size 2m;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Customer Service
    location /api/clients  { proxy_pass $customer; }
    location /api/vehicles { proxy_pass $customer; }
    location /api/users    { proxy_pass $customer; }

    # Billing Service (o webhook do Mercado Pago é só local — ver README do billing)
    location /api/budgets  { proxy_pass $billing; }
    location /api/payments { proxy_pass $billing; }

    # Execution Service
    location /api/products { proxy_pass $execution; }
    location /api/stocks   { proxy_pass $execution; }

    # Erros gerados pelo próprio nginx (ex.: linha de requisição malformada) em JSON,
    # no mesmo formato dos serviços — sem a página HTML padrão.
    error_page 400 /__gateway_400;
    error_page 502 503 504 /__gateway_5xx;
    location = /__gateway_400 {
        internal;
        default_type application/json;
        return 400 '{"status":400,"error":"Requisição malformada."}';
    }
    location = /__gateway_5xx {
        internal;
        default_type application/json;
        return 503 '{"status":503,"error":"Serviço indisponível no momento. Tente novamente em instantes."}';
    }

    # OS Service (orquestrador): /order, /service-types, /monitoring — igual ao
    # ANY /{proxy+} da raiz no API Gateway.
    location / { proxy_pass $os; }
}
