# Ambiente de desenvolvimento local da plataforma Workbench (Fase 4).
#
# Sobe, de uma vez, toda a infra que os microsserviços precisam para rodar e
# demonstrar o fluxo da Saga ponta a ponta:
#   - LocalStack (SNS/SQS)        -> mensageria da Saga        :4566
#   - Postgres os-service          -> banco do OS Service       :15432
#   - Postgres billing-service     -> banco do Billing Service  :15433
#   - Postgres customer-service    -> banco do Customer Service :15434
#   - MongoDB execution-service    -> banco do Execution (NoSQL):27017 (replica set rs0)
#
# Uso:
#   docker compose -f docker-compose.dev.yml up -d
#   (depois suba cada microsserviço com ./mvnw spring-boot:run)
#
# As credenciais abaixo casam com os defaults dos application.yml de cada serviço.
services:
  localstack:
    image: localstack/localstack:3
    container_name: workbench-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sns,sqs,sts
      - DEBUG=0
      - AWS_DEFAULT_REGION=us-east-1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  os-db:
    image: postgres:16
    container_name: workbench-os-db
    ports:
      - "15432:5432"
    environment:
      POSTGRES_DB: os_service
      POSTGRES_USER: dbadmin
      POSTGRES_PASSWORD: senha-super-segura
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbadmin -d os_service"]
      interval: 10s
      timeout: 5s
      retries: 5

  billing-db:
    image: postgres:16
    container_name: workbench-billing-db
    ports:
      - "15433:5432"
    environment:
      POSTGRES_DB: billing
      POSTGRES_USER: dbadmin
      POSTGRES_PASSWORD: senha-super-segura
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbadmin -d billing"]
      interval: 10s
      timeout: 5s
      retries: 5

  customer-db:
    image: postgres:16
    container_name: workbench-customer-db
    ports:
      - "15434:5432"
    environment:
      POSTGRES_DB: customer
      POSTGRES_USER: dbadmin
      POSTGRES_PASSWORD: senha-super-segura
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbadmin -d customer"]
      interval: 10s
      timeout: 5s
      retries: 5

  execution-mongo:
    image: mongo:7
    container_name: workbench-execution-mongo
    ports:
      - "27017:27017"
    # Execution usa transação multi-documento → exige replica set (mesmo com 1 nó).
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      # Inicializa o replica set na primeira vez (idempotente) e confirma readiness.
      test: ["CMD-SHELL", "mongosh --quiet --eval 'try { rs.status() } catch (e) { rs.initiate() }' | grep -q . || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
